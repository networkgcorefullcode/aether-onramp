---
- name: Ensure kubectl is available
  ansible.builtin.command: "which {{ kubectl_bin }}"
  register: kubectl_check
  failed_when: kubectl_check.rc != 0
  changed_when: false

- name: Check if ArgoCD namespace exists
  ansible.builtin.shell: >
    {{ kubectl_bin }} --kubeconfig {{ kubeconfig_path }} get ns argocd --ignore-not-found
  register: argocd_ns
  changed_when: false

- name: Skip deletion if ArgoCD is not installed
  ansible.builtin.debug:
    msg: "ArgoCD namespace not found — nothing to uninstall."
  when: argocd_ns.stdout == ""

- name: Delete ArgoCD namespace
  ansible.builtin.shell: >
    {{ kubectl_bin }} --kubeconfig {{ kubeconfig_path }} delete ns argocd --ignore-not-found
  register: delete_ns
  when: argocd_ns.stdout != ""
  ignore_errors: true

- name: Wait for argocd namespace to be deleted
  ansible.builtin.shell: >
    {{ kubectl_bin }} --kubeconfig {{ kubeconfig_path }} get ns argocd --ignore-not-found
  register: ns_check
  retries: 20
  delay: 5
  until: ns_check.stdout == ""
  when: argocd_ns.stdout != ""
  changed_when: false

- name: Delete ArgoCD cluster-scoped resources (ClusterRoles, CRDs, etc.)
  ansible.builtin.shell: |
    {{ kubectl_bin }} --kubeconfig {{ kubeconfig_path }} delete clusterrole,clusterrolebinding,crd,serviceaccount --ignore-not-found -l app.kubernetes.io/part-of=argocd
  register: cluster_cleanup
  when: argocd_ns.stdout != ""
  ignore_errors: true

- name: Show cleanup summary
  ansible.builtin.debug:
    msg:
      - "✅ ArgoCD namespace and resources have been removed."
      - "If any CRDs or cluster roles remain, verify manually with:"
      - "{{ kubectl_bin }} get crd | grep argoproj.io"
