---
- name: Check current kernel version
  command: uname -r
  register: current_kernel
  changed_when: false

- name: Display current kernel
  debug:
    msg: "Current kernel: {{ current_kernel.stdout }}"

- name: Update package cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Clean apt cache
  apt:
    autoclean: yes

- name: Backup original sources file
  copy:
    src: /etc/apt/sources.list.d/ubuntu.sources
    dest: /etc/apt/sources.list.d/ubuntu.sources.backup
    remote_src: true
    owner: root
    group: root
    mode: "0644"

- name: Convert all HTTP URLs to HTTPS in URIs section
  shell: sed -i '/^URIs:/ s|http://|https://|g' /etc/apt/sources.list.d/ubuntu.sources
  register: https_conversion
  changed_when: "'https_conversion' in ansible_facts" # Siempre marca como changed para forzar update

- name: Update package cache if changes were made
  apt:
    update_cache: yes
  when: https_conversion.changed

- name: Report conversion status
  debug:
    msg: |
      - Lines changed: {{ https_conversion.changed }}

- name: Check if target kernel is available
  apt:
    name: "linux-image-{{ target_kernel | default('6.8.0-55-generic') }}"
    state: latest
    update_cache: no
  register: kernel_check
  ignore_errors: yes
  changed_when: false

- name: Install target kernel with retry
  block:
    - name: Attempt kernel installation
      apt:
        name:
          - "linux-image-{{ target_kernel | default('6.8.0-55-generic') }}"
          - "linux-headers-{{ target_kernel | default('6.8.0-55-generic') }}"
        state: present
        force: yes
      register: kernel_install
      environment:
        DEBIAN_FRONTEND: noninteractive

    - name: Try alternative installation method if failed
      apt:
        name:
          - "linux-image-{{ target_kernel | default('6.8.0-55-generic') }}"
          - "linux-headers-{{ target_kernel | default('6.8.0-55-generic') }}"
        state: present
      when: kernel_install is failed
      register: kernel_install_retry

  rescue:
    - name: Handle installation failure
      debug:
        msg: "Failed to install kernel {{ target_kernel | default('6.8.0-55-generic') }}. It might not be available in repositories."

- name: Update GRUB configuration
  command: update-grub
  when: kernel_install is succeeded or kernel_install_retry is succeeded

- name: Configure GRUB to use target kernel
  lineinfile:
    path: /etc/default/grub
    regexp: "^GRUB_DEFAULT="
    line: 'GRUB_DEFAULT="Advanced options for Ubuntu>Ubuntu, with Linux {{ target_kernel | default("6.8.0-55-generic") }}"'
    state: present
    backup: yes
  when: kernel_install is succeeded or kernel_install_retry is succeeded

- name: Apply GRUB configuration changes
  command: update-grub
  when: kernel_install is succeeded or kernel_install_retry is succeeded

- name: Verify installed kernels
  shell: dpkg -l | grep linux-image | grep {{ (target_kernel | default("6.8.0-55-generic")).split('-')[0] }} || true
  register: installed_kernels
  changed_when: false

- name: Display installed kernels
  debug:
    msg: "Installed kernels: {{ installed_kernels.stdout }}"

- name: Reboot if kernel was installed
  reboot:
    msg: "Rebooting to activate kernel {{ target_kernel | default('6.8.0-55-generic') }}"
    connect_timeout: 10
    reboot_timeout: 600
    pre_reboot_delay: 10
    post_reboot_delay: 60
  when: (kernel_install is succeeded or kernel_install_retry is succeeded) and current_kernel.stdout != (target_kernel | default('6.8.0-55-generic'))

- name: Final status
  debug:
    msg: |
      Kernel change process completed.
      {% set target_kernel_var = target_kernel | default('6.8.0-55-generic') %}
      {% if (kernel_install is succeeded or kernel_install_retry is succeeded) and current_kernel.stdout != target_kernel_var %}
      System will reboot to activate kernel {{ target_kernel_var }}.
      {% elif current_kernel.stdout == target_kernel_var %}
      System is already running target kernel {{ target_kernel_var }}.
      {% else %}
      Kernel installation may have failed. Check logs for details.
      {% endif %}
