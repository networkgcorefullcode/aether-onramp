---
rke2_pod_security_admission_config_file_path: "{{ playbook_dir }}/inventory/storage/files/pod-security-admission-config.yaml"
rke2_audit_policy_config_file_path: "{{ playbook_dir }}/inventory/storage/files/audit-policy.yaml"
rke2_manifest_config_directory: "{{ playbook_dir }}/inventory/storage/pre-deploy-manifests/"
rke2_manifest_config_post_run_directory: "{{ playbook_dir }}/inventory/storage/post-deploy-manifests/"

group_rke2_config:
  # Use Cilium as the CNI
  cni:
  - multus
  - cilium
  # Cilium will replace this
  disable-kube-proxy: false
  node-label:
  - "node-role.aetherproject.org=omec-upf"
  cluster-cidr: 10.42.0.0/16
  service-cidr: 10.43.0.0/16
  kubelet-arg:
  - --allowed-unsafe-sysctls=net.*
  kube-proxy-arg:
  - --metrics-bind-address=0.0.0.0:10249
  - --proxy-mode=ipvs
