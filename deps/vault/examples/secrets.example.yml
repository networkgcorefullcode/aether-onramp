---
# Example secrets configuration for Vault
# This file demonstrates how to organize secrets in Vault

# Database credentials
database:
  postgresql:
    host: "db.example.com"
    port: 5432
    username: "app_user"
    password: "change_me_in_vault"
    database: "app_db"
  
  mysql:
    host: "mysql.example.com"
    port: 3306
    username: "app_user"
    password: "change_me_in_vault"
    database: "app_db"

# API Keys
api_keys:
  github_token: "ghp_xxxxxxxxxxxxxxxxxxxx"
  aws_access_key: "AKIAXXXXXXXXXXXXXXXX"
  aws_secret_key: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
  stripe_api_key: "sk_test_xxxxxxxxxxxxxxxxxxxx"

# Application secrets
app:
  jwt_secret: "change_me_in_vault"
  encryption_key: "change_me_in_vault"
  session_secret: "change_me_in_vault"

# Cloud provider credentials
cloud:
  aws:
    access_key: "AKIAXXXXXXXXXXXXXXXX"
    secret_key: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
    region: "us-east-1"
  
  azure:
    tenant_id: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
    client_id: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
    client_secret: "change_me_in_vault"

# Kubernetes secrets
kubernetes:
  admin_token: "change_me_in_vault"
  service_account_key: "change_me_in_vault"

# LDAP/AD credentials
ldap:
  bind_dn: "cn=admin,dc=example,dc=com"
  bind_password: "change_me_in_vault"
  server: "ldap://ldap.example.com:389"

# SMTP credentials
smtp:
  host: "smtp.gmail.com"
  port: 587
  username: "noreply@example.com"
  password: "change_me_in_vault"

# TLS Certificates
tls:
  cert_path: "/path/to/cert.pem"
  key_path: "/path/to/key.pem"
  ca_path: "/path/to/ca.pem"
