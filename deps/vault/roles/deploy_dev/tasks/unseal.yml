---

- name: Reading unseal key contents
  command: cat {{ item }}
  register: unseal_keys
  with_fileglob: "{{ vault.unseal_keys_dir_output }}/*"
  delegate_to: localhost
  become: no
  changed_when: false

- name: Check vault status
  shell: vault status -format=json
  environment:
    VAULT_ADDR: "http://{{ vault.address }}"
  register: vault_status
  failed_when: false
  changed_when: false

- name: Parse vault status
  set_fact:
    vault_sealed: "{{ (vault_status.stdout | from_json).sealed }}"
    vault_initialized: "{{ (vault_status.stdout | from_json).initialized }}"

- name: Unseal vault with unseal keys
  shell: |
    vault operator unseal {{ item.stdout }}
  environment:
    VAULT_ADDR: "http://{{ vault.address }}"
  with_items: "{{ unseal_keys.results }}"
  when: 
    - unseal_keys.results | length > 0
    - vault_initialized | bool
    - vault_sealed | bool
  no_log: true

- name: Verify vault is unsealed
  shell: vault status
  environment:
    VAULT_ADDR: "http://{{ vault.address }}"
  register: vault_final_status
  failed_when: false
  changed_when: false

- name: Display vault status
  debug:
    var: vault_final_status.stdout_lines
