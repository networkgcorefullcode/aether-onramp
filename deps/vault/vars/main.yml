vault:
  version: "1.21.1"
  user: "vault"
  group: "vault"
  install_prerequisites:
    - unzip
    - curl
  config_path: "/etc/vault.hcl"
  data_path: "/opt/vault/data"
  
  # Dev mode configuration
  dev_mode: true
  address: "0.0.0.0:8200"
  
  # Unseal configuration
  unseal_keys_dir_output: "{{ playbook_dir }}/vault_keys/unseal_keys"
  root_token_dir_output: "{{ playbook_dir }}/vault_keys/root_token"

  kubernetes:
    # Source CA cert on the RKE2 server
    server_ca_src: "/etc/kubernetes/pki/ca.crt"

    # kubectl environment (optional)
    kubectl_kubeconfig: ""

    # Manifest for ServiceAccount + ClusterRoleBinding
    sa_manifest_src: "{{ ROOT_DIR }}/kube_apply/sa-vault.yaml"
    sa_manifest_remote: "/tmp/sa-vault.yaml"

    # ServiceAccount used by Vault to review tokens
    namespace: "aether-5gc"
    serviceaccount: "vault-auth"

    # Terraform tfvars to update (on the controller running Ansible)
    tfvars_path: "{{ ROOT_DIR }}/terraform/enviroments/dev/terraform.tfvars"
