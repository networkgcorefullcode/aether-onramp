---
- name: Ensure kubectl is installed
  ansible.builtin.command: which {{ kubectl_bin }}
  register: kubectl_check
  failed_when: kubectl_check.rc != 0
  changed_when: false

- name: Download Argo CD official manifest
  ansible.builtin.get_url:
    url: "{{ argocd_manifest_url }}"
    dest: "{{ downloaded_manifest }}"
    mode: "0644"

- name: Create argocd namespace (ignore if exists)
  ansible.builtin.command: >
    {{ kubectl_bin }} --kubeconfig {{ kubeconfig_path }} create namespace argocd
  register: ns_create
  failed_when: ns_create.rc not in [0,1]
  changed_when: ns_create.rc == 0

- name: Apply Argo CD manifest
  ansible.builtin.command: >
    {{ kubectl_bin }} --kubeconfig {{ kubeconfig_path }}
    apply -n argocd -f {{ downloaded_manifest }}
  register: argocd_apply
  changed_when: "'configured' in argocd_apply.stdout or 'created' in argocd_apply.stdout"

- name: Wait for Argo CD pods to be ready
  ansible.builtin.command: >
    {{ kubectl_bin }} --kubeconfig {{ kubeconfig_path }}
    -n argocd wait --for=condition=Available --timeout=600s deploy/argocd-server
  register: wait_deploy
  changed_when: false

- name: Get initial admin password
  ansible.builtin.shell: >
    {{ kubectl_bin }} --kubeconfig {{ kubeconfig_path }}
    -n argocd get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 --decode
  register: argocd_admin_pass
  args:
    executable: /bin/bash

- name: Patch argocd-server Service to NodePort
  ansible.builtin.command: >
    {{ kubectl_bin }} --kubeconfig {{ kubeconfig_path }}
    -n argocd patch svc argocd-server
    -p '{"spec": {"type": "NodePort"}}'
  register: patch_service
  changed_when: "'patched' in patch_service.stdout or patch_service.rc == 0"

- name: Get NodePort of argocd-server
  ansible.builtin.shell: >
    {{ kubectl_bin }} --kubeconfig {{ kubeconfig_path }}
    -n argocd get svc argocd-server
    -o jsonpath="{.spec.ports[?(@.port==443)].nodePort}"
  register: nodeport
  changed_when: false

- name: Show initial password
  ansible.builtin.debug:
    msg: "ArgoCD admin user: admin, password: {{ argocd_admin_pass.stdout }}"

- name: Show ArgoCD UI access info
  ansible.builtin.debug:
    msg: "ArgoCD UI available on https://<NODE_IP>:{{ nodeport.stdout }}"
