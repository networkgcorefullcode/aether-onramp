core:
  standalone: true
  data_iface: ens18
  values_file: "roles/core/templates/sdcore-5g-values.yaml"
  #values_file: "deps/5gc/roles/core/templates/sdcore-5g-values-local-chart.yaml"
  ran_subnet: "172.20.0.0/16"		 # set it to empty to get subnet from 'data_iface'

  helm:
    local_charts: false
    chart_ref: aether/sd-core
    #chart_ref: /home/abelct/aether/aether-onramp-avangenio/deps/5gc/roles/core/local_chart/5g-control-plane
    #chart_version: 2.0.0
    chart_version: 2.2.8

  upf:
    access_subnet: "192.168.252.1/24"	# access subnet & gateway
    core_subnet: "192.168.250.1/24"	# core subnet & gateway
    mode: af_packet			# Options: af_packet or dpdk
    multihop_gnb: false                 # when set to true, access subnet will be same as data_iface
    default_upf:
      ip:
        access: "192.168.252.3"         # when multihop_gnb set to true, make sure to assign IP from same subnet of data_iface
        core:   "192.168.250.3"
      ue_ip_pool: "172.250.0.0/16"

    additional_upfs:
      "1":
        ip:
          access: "192.168.252.6"
          core:   "192.168.250.6"
        ue_ip_pool: "172.248.0.0/16"
      # "2":
      #   ip:
      #     access: "192.168.252.7"
      #     core:   "192.168.250.7"
      #   ue_ip_pool: "172.248.0.0/16"

  open5gs:
    standalone: true
    data_iface: data
    values_file: "deps/5gc/roles/udm-open5GS/templates/values-5g.yaml"
    ran_subnet: "" # set it to empty to get subnet from 'data_iface'

  open5gs_helm:
    local_charts: true
    chart_ref: "/home/abelct/aether/aether-onramp-avangenio/deps/5gc/roles/udm-open5GS/local_chart/open5gs"
    chart_version: 2.2.9