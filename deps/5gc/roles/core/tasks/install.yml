- name: update aether 5gc-cp helm dependencies
  shell: |
    helm dep up /tmp/sdcore-helm-charts/5g-control-plane
  when: inventory_hostname in groups['master_nodes'] and core.helm.local_charts

# - name: update aether 5gc-cp helm dependencies
#   shell: |
#     helm dep up /tmp/sdcore-helm-charts/sd-core/charts/5g-control-plane
#   when: inventory_hostname in groups['master_nodes'] and core.helm.local_charts

- name: update aether 5gc helm dependencies
  shell: |
    helm dep up {{chart_ref_sd_core}}
  when: inventory_hostname in groups['master_nodes'] and core.helm.local_charts

- name: Manage Kustomize installation on Kubernetes master nodes
  when: inventory_hostname in groups['master_nodes']
  block:
  - name: Check if Kustomize is already installed
    ansible.builtin.command: which kustomize
    register: kustomize_exists
    ignore_errors: true
    changed_when: false
    check_mode: no
    #when: inventory_hostname in groups['master_nodes']

  - name: Install Kustomize on master nodes
    when: kustomize_exists.rc != 0 and inventory_hostname in groups['master_nodes'] 
    block:
      - name: Download Kustomize installation script
        ansible.builtin.get_url:
          url: "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh"
          dest: /tmp/install_kustomize.sh
          mode: '0755'

      - name: Run Kustomize installation script
        ansible.builtin.command: /tmp/install_kustomize.sh
        args:
          chdir: /tmp # Ejecutar en el directorio /tmp para que el binario se cree ahí
        #when: inventory_hostname in groups['master_nodes'] 

      - name: Move Kustomize binary to a standard path
        ansible.builtin.copy:
          src: /tmp/kustomize
          dest: /usr/local/bin/kustomize
          remote_src: yes # Importante: indica que el origen está en el nodo remoto
          mode: '0755'
        become: true # Necesitamos sudo para escribir en /usr/local/bin
        #when: inventory_hostname in groups['master_nodes'] 

- name: Copy Helm Kustomize patches to the master node
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/helm-patches/" # Ruta en tu máquina de control
    dest: /tmp/helm-patches/ # Ruta en el nodo remoto (node1)
    mode: '0755' # Asegura que los scripts sean ejecutables
  when: inventory_hostname in groups['master_nodes']

# TODO: add systems check to avoid issues (e.g., mongodb needing avx support)
- name: deploy aether 5gc
  block:
    - name: deploy aether 5gc
      kubernetes.core.helm:
        update_repo_cache: true
        name: sd-core
        release_namespace: aether-5gc
        create_namespace: true
        chart_ref: "{{ core.helm.chart_ref if core.helm.local_charts == false else chart_ref_sd_core }}"
        chart_version: "{{ core.helm.chart_version }}"
        values_files:
          - /tmp/sdcore-5g-values.yaml
        wait: true
        wait_timeout: "2m30s"
        post_renderer: "/tmp/helm-patches/webui/post-render.sh"
        force: true
      when: inventory_hostname in groups['master_nodes']

  rescue:
    - name: Get Pods Status
      shell: kubectl get po -n aether-5gc
      register: pod_status
      changed_when: false
      when: inventory_hostname in groups['master_nodes']

    - name: restart Pods if not running
      shell: |
        while IFS= read -r line; do
          name=$(echo "$line" | awk '{print $1}')
          status=$(echo "$line" | awk '{print $3}')

          if [[ "$status" != "Running" ]]; then
            kubectl delete pod "$name" -n aether-5gc
          fi
        done <<< "{{ pod_status.stdout }}"
      args:
        executable: /bin/bash
      when: inventory_hostname in groups['master_nodes']
  always:
    - pause:
        seconds: 60
