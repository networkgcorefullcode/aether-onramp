# Disable 4G Control Plane
omec-control-plane:
  enable4G: false

# Disable 5G RAN Simulator
5g-ran-sim:
  enable: false

# Override values for 5g-control-plane Helm Chart
# https://github.com/omec-project/sdcore-helm-charts/blob/main/5g-control-plane/values.yaml
5g-control-plane:
  enable5G: true
  images:
    repository: "192.168.12.15:8083/"
    tags:
      amf: omecproject/5gc-amf:2.0.3-dev
      ausf: omecproject/5gc-ausf:2.0.4-dev
      smf: omecproject/5gc-smf:3.0.1-dev
      udm: omecproject/5gc-udm:2.1.4-dev
      udr: omecproject/5gc-udr:2.1.6-dev
      pcf: omecproject/5gc-pcf:2.0.2-dev
      nrf: omecproject/5gc-nrf:2.0.4-dev
      webui: omecproject/5gc-webui:1.10.6-dev
      nssf: omecproject/5gc-nssf:1.7.1-dev
      init: omecproject/pod-init:rel-1.1.3
      upfadapter: omecproject/upfadapter:2.0.6-dev
      metricfunc: omecproject/metricfunc:rel-1.6.2
      sctplb: omecproject/sctplb:1.6.6-dev
      #sctplb: sctplb:1.6.7-dev
      #upfadapter: upfadapter:2.0.7-dev
    pullPolicy: IfNotPresent

  kafka:
    deploy: true

  mongodb:
    deploy: true
    usePassword: false
    persistence:
      enabled: false
    architecture: replicaset
    replicaCount: 1

  config:
    mongodb:
      name: aether
      url: mongodb://mongodb-arbiter-headless # Enable if cluster deployment required
      authKeysDbName: authentication
      authUrl: mongodb://mongodb-arbiter-headless
    
    amf:
      deploy: true
      serviceType: ClusterIP
      #ngapp:
       # nodePort: 30071
      cfgFiles:
        amfcfg.yaml:
          configuration:
            enableDBStore: true # Store AMF subscribers in the datastore
            networkFeatureSupport5GS: # 5gs Network Feature Support IE, refer to TS 24.501 sec. 9.11.3.5
              imsVoPS: 1 # IMS voice over PS session indicator (uinteger, range: 0~1)
            security:
              integrityOrder:
                 - NIA3
                 - NIA2
            #     - NIA0
              cipheringOrder:
                 - NEA3
                 - NEA2
            #     - NEA0
            sbi: # Service-based interface information
              scheme: http # the protocol for sbi (http or https)
              registerIPv4: amf # IP used to register to NRF
              bindingIPv4: 0.0.0.0  # IP used to bind the service
              port: 29518 # port used to bind the service
              tls: # the local path of TLS key
                key: /var/run/certs/tls.key # AMF TLS Private key
                pem: /var/run/certs/tls.crt # AMF TLS Certificate
            nrfUri: "http://nrf:29510" # a valid URI of NRF
            kafkaInfo:
              enableKafka: true
              brokerUri: "kafka-headless"
              brokerPort: 9092
              topicName: "sdcore-data-source-amf"
    smf:
      cfgFiles:
        # https://github.com/omec-project/smf/blob/main/config/uerouting.yaml
        uerouting.yaml:
          info:
            version: 1.0.0
            description: Routing information for UE
        # https://github.com/omec-project/smf/blob/main/config/smfcfg.yaml
        smfcfg.yaml:
          info:
            version: 1.0.0
            description: SMF initial local configuration
          configuration:
            smfDBName: sdcore_smf
            enableDBStore: true
            kafkaInfo:
              enableKafka: false
              brokerUri: "kafka-headless"
              brokerPort: 9092
              topicName: "sdcore-data-source-amf"

    webui:
      serviceType: NodePort
      cfgFiles:
        webuicfg.yaml:
          info:
            version: 1.0.0
            description: WebUI initial local configuration
          configuration:
            mongodb:                    # Configuración de la base de datos MongoDB
              name: "aether"              # (string) Nombre de la base de datos principal
              url: "mongodb://mongodb-arbiter-headless" # (string) URL de conexión a MongoDB
              authKeysDbName: "authentication"   # (string) Nombre de la base de datos de llaves de autenticación
              authUrl: "mongodb://mongodb-arbiter-headless" # (string) URL de autenticación
              checkReplica: true

    upfadapter:
      deploy: false

    metricfunc:
      deploy: true
      serviceType: ClusterIP
      prometheus:
        port: 9089
      apiEndpoint:
        port: 9301
      cfgFiles:
        metricscfg.yaml:
          configuration:
            controllerFlag: false
            nfStreams:
              - topic:
                  topicGroup: analytics
                  topicName: sdcore-data-source-amf
                urls:
                  - uri: "kafka-headless"
                    port: 9092
              - topic:
                  topicGroup: analytics
                  topicName: sdcore-data-source-smf
                urls:
                  - uri: "kafka-headless"
                    port: 9092
            prometheusServer:
              addr: POD_IP
              port: 9089
            apiServer:
              addr: POD_IP
              port: 9301
            debugProfileServer:
              addr: POD_IP
              port: 5001
            userAppApiServer:
              addr: "userAppapp"
              port: 9301
            rocEndPoint:
              addr: "roc-aether-roc-gui-v2-1-external.aether-roc.svc"
              port: 80
            metricFuncEndPoint:
              addr: "metricfunc.aether-5gc.svc"
              port: 5001
          info:
            description: Metrics initial local configuration
            version: 1.0.0
          logger:
            level: info
    
    sctplb:
      deploy: true
      podAnnotations:
        field.cattle.io/workloadMetrics: '[{"path":"/metrics","port":9089,"schema":"HTTP"}]'
      serviceType: ClusterIP
      sctp_grpc:
        port: 9000
        #nodePort: 30088
      ngapp:
        externalIp: {{ core.amf.ip }}
        port: 38412
        #nodePort: 30071
      cfgFiles:
        sctplb.yaml:
          info:
            version: 1.0.0
            description: SCTPLB initial local configuration
          logger:
            sctpLogs: info
            dispatcherLogs: info
            clientdiscLogs: info
          configuration:
            type: "grpc"
            services:
              - uri: "amf-headless"
            ngapIpList:
              - 0.0.0.0
    
# Override values for omec-sub-provision (subscriber) Helm Chart
# https://github.com/omec-project/sdcore-helm-charts/blob/main/omec-sub-provision/values.yaml
