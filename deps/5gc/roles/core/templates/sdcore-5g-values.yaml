# Disable 4G Control Plane
omec-control-plane:
  enable4G: false

# Disable 5G RAN Simulator
5g-ran-sim:
  enable: false

# Override values for 5g-control-plane Helm Chart
# https://github.com/omec-project/sdcore-helm-charts/blob/main/5g-control-plane/values.yaml
5g-control-plane:
  enable5G: true
  images:
    repository: "192.168.12.15:8083/"
    tags:
      amf: omecproject/5gc-amf:2.0.1-dev
      ausf: omecproject/5gc-ausf:2.0.3-dev
      smf: omecproject/5gc-smf:3.0.0-dev
      udm: omecproject/5gc-udm:2.1.4-dev
      udr: omecproject/5gc-udr:2.1.4-dev
      pcf: omecproject/5gc-pcf:2.0.1-dev
      nrf: omecproject/5gc-nrf:2.0.3-dev
      webui: omecproject/5gc-webui:1.10.3-dev
      sctplb: omecproject/sctplb:1.6.6-dev
      nssf: omecproject/5gc-nssf:1.7.0-dev
      upfadapter: omecproject/upfadapter:2.0.6-dev
    # refer to above Helm Chart to add other NF images

  kafka:
    deploy: true

  mongodb:
    usePassword: false
    persistence:
      enabled: false
    architecture: replicaset
    replicaCount: 2

  resources:
    enabled: false

  config:
    logger:
        NRF:
          debugLevel: debug
    #   Util:
    #     debugLevel: warn
    #   AMF:
    #     debugLevel: debug
    #   SMF:
    #     debugLevel: debug

    mongodb:
      name: aether
      url: mongodb://mongodb-arbiter-headless # Enable if cluster deployment required
      authKeysDbName: authentication
      authUrl: mongodb://mongodb-arbiter-headless

    managedByConfigPod:
      enabled: true
      syncUrl: http://sdcore-adapter-v2-1.aether-roc.svc:8080/synchronize

    # sctplb:
    #   deploy: true # If enabled then deploy sctp pod
    #   ngapp:
    #     externalIp: {{ core.amf.ip }}
    #     port: 38412

    sctplb:
      deploy: true
      podAnnotations:
        field.cattle.io/workloadMetrics: '[{"path":"/metrics","port":9089,"schema":"HTTP"}]'
      serviceType: ClusterIP
      sctp_grpc:
        port: 9000
        #nodePort: 30088
      ngapp:
        externalIp: {{ core.amf.ip }}
        port: 38412
        #nodePort: 30071
      cfgFiles:
        sctplb.yaml:
          info:
            version: 1.0.0
            description: SCTPLB initial local configuration
          logger:
            sctpLogs: info
            dispatcherLogs: info
            clientdiscLogs: info
          configuration:
            type: "grpc"
            services:
              - uri: "amf-headless"
            ngapIpList:
              - 0.0.0.0

    upfadapter:
      deploy: false # If enabled then deploy upf adapter pod

    # metricfunc:
    #   deploy: true

    metricfunc:
      deploy: false
      serviceType: ClusterIP
      prometheus:
        port: 9089
      apiEndpoint:
        port: 9301
      cfgFiles:
        metricscfg.yaml:
          configuration:
            controllerFlag: false
            nfStreams:
              - topic:
                  topicGroup: analytics
                  topicName: sdcore-data-source-amf
                urls:
                  - uri: "kafka-headless"
                    port: 9092
              - topic:
                  topicGroup: analytics
                  topicName: sdcore-data-source-smf
                urls:
                  - uri: "kafka-headless"
                    port: 9092
            prometheusServer:
              addr: POD_IP
              port: 9089
            apiServer:
              addr: POD_IP
              port: 9301
            debugProfileServer:
              addr: POD_IP
              port: 5001
            userAppApiServer:
              addr: "userAppapp"
              port: 9301
            rocEndPoint:
              addr: "roc-aether-roc-gui-v2-1-external.aether-roc.svc"
              port: 80
            metricFuncEndPoint:
              addr: "metricfunc.aether-5gc.svc"
              port: 5001
          info:
            description: Metrics initial local configuration
            version: 1.0.0
          logger:
            level: info

    # Change AMF config here if rquired
    # Most of the AMF config comes from Slice APIs but some of the config is
    # directly provided through Helm Charts
    amf:
      deploy: true
      cfgFiles:
        amfcfg.yaml:
          configuration:
            enableDBStore: true # Store AMF subscribers in the datastore
            networkFeatureSupport5GS: # 5gs Network Feature Support IE, refer to TS 24.501 sec. 9.11.3.5
              imsVoPS: 1 # IMS voice over PS session indicator (uinteger, range: 0~1)
            security:
              integrityOrder:
                 - NIA3
                 - NIA2
            #     - NIA0
              cipheringOrder:
                 - NEA3
                 - NEA2
            #     - NEA0
            sbi: # Service-based interface information
              scheme: http # the protocol for sbi (http or https)
              registerIPv4: amf # IP used to register to NRF
              bindingIPv4: 0.0.0.0  # IP used to bind the service
              port: 29518 # port used to bind the service
              tls: # the local path of TLS key
                key: /var/run/certs/tls.key # AMF TLS Private key
                pem: /var/run/certs/tls.crt # AMF TLS Certificate
            nrfUri: "http://nrf:29510" # a valid URI of NRF
          #   amfName: AMF # the name of this AMF
          #   amfDBName: "amf_db"   # Nombre de la base de datos MongoDB para el AMF
          #   ngapIpList:  # the IP list of N2 interfaces on this AMF
          #     - 0.0.0.0
          #   ngappPort: 38412                      # Puerto UDP/TCP usado por NGAP
          #   sctpGrpcPort: 9000                   # Puerto gRPC para comunicaciones SCTP
          #   enableSctpLb: true                    # Habilitar el balanceador de carga SCTP
          #   mongodb:                              # Configuración de conexión a MongoDB
          #      name: "aether"                      # Nombre de la base de datos
          #      url: "mongodb://mongodb-arbiter-headless"  # URL de conexión con credenciales y host:puerto
          #   webuiUri: "webui:9876" # URI del WebUI del AMF
          #   enableNrfCaching: true                # Habilitar caching de NRF
          #   nrfCacheEvictionInterval: 300         # Intervalo (s) para expulsión de caché NRF
          #   serviceNameList: # the SBI services provided by this AMF, refer to TS 29.518
          #     - namf-comm # Namf_Communication service
          #     - namf-evts # Namf_EventExposure service
          #     - namf-mt   # Namf_MT service
          #     - namf-loc  # Namf_Location service
          #     - namf-oam  # OAM service
          #   # servedGuamiList: # Guami (Globally Unique AMF ID) list supported by this AMF
          #   #   # <GUAMI> = <MCC><MNC><AMF ID>
          #   #   - plmnId: # Public Land Mobile Network ID, <PLMN ID> = <MCC><MNC>
          #   #       mcc: 208 # Mobile Country Code (3 digits string, digit: 0~9)
          #   #       mnc: 93 # Mobile Network Code (2 or 3 digits string, digit: 0~9)
          #   #     amfId: cafe00 # AMF identifier (3 bytes hex string, range: 000000~FFFFFF)
          #   # supportTaiList:  # the TAI (Tracking Area Identifier) list supported by this AMF
          #   #   - plmnId: # Public Land Mobile Network ID, <PLMN ID> = <MCC><MNC>
          #   #       mcc: 208 # Mobile Country Code (3 digits string, digit: 0~9)
          #   #       mnc: 93 # Mobile Network Code (2 or 3 digits string, digit: 0~9)
          #   #     tac: 1 # Tracking Area Code (uinteger, range: 0~16777215)
          #   # plmnSupportList: # the PLMNs (Public land mobile network) list supported by this AMF
          #   #   - plmnId: # Public Land Mobile Network ID, <PLMN ID> = <MCC><MNC>
          #   #       mcc: 208 # Mobile Country Code (3 digits string, digit: 0~9)
          #   #       mnc: 93 # Mobile Network Code (2 or 3 digits string, digit: 0~9)
          #   #     snssaiList: # the S-NSSAI (Single Network Slice Selection Assistance Information) list supported by this AMF
          #   #       - sst: 1 # Slice/Service Type (uinteger, range: 0~255)
          #   #         sd: 010203 # Slice Differentiator (3 bytes hex string, range: 000000~FFFFFF)
          #   #       - sst: 1 # Slice/Service Type (uinteger, range: 0~255)
          #   #         sd: 112233 # Slice Differentiator (3 bytes hex string, range: 000000~FFFFFF)
          #   supportDnnList:  # the DNN (Data Network Name) list supported by this AMF
