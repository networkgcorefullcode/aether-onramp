omec-sub-provision:
  enable: true
  images:
    repository: "192.168.12.15:8083/"
    tags:
      simapp: omecproject/simapp:1.6.5-dev
      init: omecproject/pod-init:rel-1.1.3

  config:
    simapp:
      cfgFiles:
