    ausf:
      deploy: true
      serviceType: ClusterIP
      cfgFiles:
        ausfcfg.yaml:
          configuration:
            enableDBStore: true
            groupId: ausfGroup001
            sbi:
              bindingIPv4: 0.0.0.0
              port: 29509
              registerIPv4: ausf
              scheme: http
              tls: # the local path of TLS key
                key: /var/run/certs/tls.key # AUSF TLS Private key
                pem: /var/run/certs/tls.crt # AUSF TLS Certificate
            serviceNameList:
              - nausf-auth
            nrfUri: "http://nrf:29510"
            webuiUri: "http://webui:5001" # URI del WebUI del AMF
          logger:
            AUSF:
              debugLevel: debug
              ReportCaller: false


    udr:
      deploy: true
      cfgFiles:
        udrcfg.yaml:
          configuration:
            enableDBStore: true
            sbi: # Service Based Interface
              scheme: http
              registerIPv4: udr
              bindingIPv4: 0.0.0.0
              port: 29504
              tls: # the local path of TLS key
                key: /var/run/certs/tls.key # UDR TLS Private key
                pem: /var/run/certs/tls.crt # UDR TLS Certificate
            mongodb:
               name: "aether"                      # Nombre de la base de datos
               url: mongodb://mongodb-arbiter-headless  # URL de conexión con credenciales y host:puerto
            nrfUri: "http://nrf:29510"
            webuiUri: "http://webui:5001"
          logger:
            UDR:
              debugLevel: debug
              ReportCaller: false


    udm:
      deploy: true
      cfgFiles:
        udmcfg.yaml:
          configuration:
            enableDBStore: true
            sbi:
              bindingIPv4: 0.0.0.0
              port: 29503
              registerIPv4: udm
              scheme: http
              tls:
                key: /var/run/certs/tls.key # UDM TLS Private key
                pem: /var/run/certs/tls.crt # UDM TLS Certificate
            nrfUri: "http://nrf:29510"
            plmnList:
            - plmnId:
                mcc: "208"
                mnc: "93"
            - plmnId:
                mcc: "222"
                mnc: "88"
            enableNrfCaching: true
            nrfCacheEvictionInterval: 900
            webuiUri: "http://webui:5001"
            serviceList:
              - nudm-sdm
              - nudm-uecm
              - nudm-ueau
              - nudm-ee
              - nudm-pp
          info:
            description: UDM initial local configuration
            version: 1.0.0
          logger:
            UDM:
              debugLevel: debug
              ReportCaller: false


    # SMF config override. Refer to Helm Charts values for more options
