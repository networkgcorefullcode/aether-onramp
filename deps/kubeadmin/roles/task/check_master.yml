---

- name: Check if node is reachable via ping
  ping:
  register: ping_result
  ignore_errors: yes

- name: Display ping result
  debug:
    msg: "Master node {{ inventory_hostname }} is reachable"
  when: ping_result is succeeded

- name: Display unreachable master nodes
  debug:
    msg: "WARNING: Master node {{ inventory_hostname }} is NOT reachable"
  when: ping_result is failed

- name: Check if kubectl is installed
  command: which kubectl
  register: kubectl_check
  ignore_errors: yes
  when: ping_result is succeeded

- name: Check if node is part of Kubernetes cluster
  shell: kubectl get nodes {{ inventory_hostname }} -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'
  register: node_ready_status
  ignore_errors: yes
  when: 
    - ping_result is succeeded
    - kubectl_check is succeeded

- name: Display master node status
  debug:
    msg: "Master node {{ inventory_hostname }} status: {{ 'Ready' if node_ready_status.stdout == 'True' else 'Not Ready or Not in cluster' }}"
  when: 
    - ping_result is succeeded
    - kubectl_check is succeeded
    - node_ready_status is defined

- name: Check if node has control-plane role
  shell: kubectl get node {{ inventory_hostname }} -o jsonpath='{.metadata.labels.node-role\.kubernetes\.io/control-plane}'
  register: master_role_check
  ignore_errors: yes
  when:
    - ping_result is succeeded
    - kubectl_check is succeeded

- name: Verify master role
  debug:
    msg: "Master node {{ inventory_hostname }} has control-plane role: {{ 'Yes' if master_role_check.stdout != '' else 'No - Check configuration' }}"
  when:
    - ping_result is succeeded
    - kubectl_check is succeeded
    - master_role_check is defined

- name: Get all master nodes from cluster
  shell: kubectl get nodes -l node-role.kubernetes.io/control-plane -o jsonpath='{.items[*].metadata.name}'
  register: cluster_masters
  run_once: true
  delegate_to: "{{ groups['master_nodes'][0] }}"
  ignore_errors: yes
  when: ping_result is succeeded

- name: Display all active master nodes in cluster
  debug:
    msg: "Active master nodes in cluster: {{ cluster_masters.stdout.split() }}"
  run_once: true
  when: 
    - ping_result is succeeded
    - cluster_masters is defined
    - cluster_masters is succeeded

- name: Summary of master nodes health check
  hosts: localhost
  gather_facts: no
  tasks:
    - name: Display summary
      debug:
        msg: "Master nodes health check completed. Review output above for details."
