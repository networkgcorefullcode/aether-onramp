---

- name: Check if node is reachable via ping
  ping:
  register: ping_result
  ignore_errors: yes

- name: Display ping result
  debug:
    msg: "Worker node {{ inventory_hostname }} is reachable"
  when: ping_result is succeeded

- name: Display unreachable worker nodes
  debug:
    msg: "WARNING: Worker node {{ inventory_hostname }} is NOT reachable"
  when: ping_result is failed

- name: Check if kubelet is running
  systemd:
    name: kubelet
  register: kubelet_status
  ignore_errors: yes
  when: ping_result is succeeded

- name: Display kubelet service status
  debug:
    msg: "Worker node {{ inventory_hostname }} kubelet status: {{ kubelet_status.status.ActiveState | default('unknown') }}"
  when:
    - ping_result is succeeded
    - kubelet_status is defined

- name: Get node status from master
  shell: kubectl get nodes {{ inventory_hostname }} -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'
  register: node_ready_status
  delegate_to: "{{ groups['master_nodes'][0] }}"
  ignore_errors: yes
  when: ping_result is succeeded

- name: Display worker node status in cluster
  debug:
    msg: "Worker node {{ inventory_hostname }} cluster status: {{ 'Ready' if node_ready_status.stdout == 'True' else 'Not Ready or Not joined' }}"
  when:
    - ping_result is succeeded
    - node_ready_status is defined

- name: Check worker node role
  shell: kubectl get node {{ inventory_hostname }} -o jsonpath='{.metadata.labels}'
  register: worker_labels
  delegate_to: "{{ groups['master_nodes'][0] }}"
  ignore_errors: yes
  when: ping_result is succeeded

- name: Display worker node labels
  debug:
    msg: "Worker node {{ inventory_hostname }} labels: {{ worker_labels.stdout | default('No labels found') }}"
  when:
    - ping_result is succeeded
    - worker_labels is defined

- name: Get worker node resource usage
  shell: |
    kubectl top node {{ inventory_hostname }} 2>/dev/null || echo "Metrics not available"
  register: node_resources
  delegate_to: "{{ groups['master_nodes'][0] }}"
  ignore_errors: yes
  when: ping_result is succeeded

- name: Display worker node resources
  debug:
    msg: "Worker node {{ inventory_hostname }} resources: {{ node_resources.stdout }}"
  when:
    - ping_result is succeeded
    - node_resources is defined

- name: Get all worker nodes from cluster
  shell: kubectl get nodes --selector='!node-role.kubernetes.io/control-plane' -o jsonpath='{.items[*].metadata.name}'
  register: cluster_workers
  run_once: true
  delegate_to: "{{ groups['master_nodes'][0] }}"
  ignore_errors: yes

- name: Display all active worker nodes in cluster
  debug:
    msg: "Active worker nodes in cluster: {{ cluster_workers.stdout.split() | default([]) }}"
  run_once: true
  when:
    - cluster_workers is defined
    - cluster_workers is succeeded

- name: Summary of worker nodes health check
  hosts: localhost
  gather_facts: no
  tasks:
    - name: Display summary
      debug:
        msg: "Worker nodes health check completed. Review output above for details."
