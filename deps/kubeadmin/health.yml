---
# Playbook to check health of all Kubernetes nodes
# Usage: ansible-playbook -i hosts.ini health.yml

- name: Health check for Kubernetes master nodes
  hosts: master_nodes
  become: yes
  gather_facts: yes
  roles:
    - task
  tags:
    - check
    - health
    - master

- name: Health check for Kubernetes worker nodes
  hosts: worker_nodes
  become: yes
  gather_facts: yes
  roles:
    - task
  tags:
    - check
    - health
    - worker

- name: Summary of health check
  hosts: localhost
  gather_facts: no
  tasks:
    - name: Display summary
      debug:
        msg: "Health check completed for all nodes. Review output above for details."
