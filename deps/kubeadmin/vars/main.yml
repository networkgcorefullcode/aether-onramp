---
# Containerd configuration variables
# Uncomment and configure as needed

# Enable SystemdCgroup for Kubernetes compatibility (default: true)
containerd_enable_systemd_cgroup: true

# Custom containerd configuration (inline TOML)
containerd_custom_config: |
  version = 2
  [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc]
    runtime_type = "io.containerd.runc.v2"
    [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc.options]
      SystemdCgroup = true

#Path to custom containerd config file (alternative to inline config)
containerd_config_file: /path/to/custom/config.toml

# Registry mirrors configuration
containerd_registry_mirrors:
  docker.io:
    - "https://mirror.gcr.io"
    - "https://registry-1.docker.io"
  quay.io:
    - "https://quay.io"

# Insecure registries (skip TLS verification)
containerd_insecure_registries:
  - "myregistry.local:5000"
  - "192.168.1.100:5000"

# Example: Full custom configuration
containerd_custom_config: |
  version = 2
  root = "/var/lib/containerd"
  state = "/run/containerd"
  oom_score = 0
  [grpc]
    address = "/run/containerd/containerd.sock"
    uid = 0
    gid = 0
  [plugins."io.containerd.grpc.v1.cri"]
    sandbox_image = "registry.k8s.io/pause:3.9"
    [plugins."io.containerd.grpc.v1.cri".containerd]
      [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc]
        runtime_type = "io.containerd.runc.v2"
        [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc.options]
          SystemdCgroup = true
