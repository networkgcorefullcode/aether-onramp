apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aether-5g-core-dev
  namespace: argocd
spec:
  # El proyecto por defecto donde viven los recursos de la App
  project: default

  source:
    #  APUNTA A LA URL DEL CHART
    repoURL: https://charts.aetherproject.org
    # ESPECIFICA EL NOMBRE DEL CHART
    chart: 'sd-core'
   #path: some/path # por ahora no aplica
    # INDICA LA REVISIÓN (Commit SHA o rama, leído del repo público)
    targetRevision: 2.2.4

    # Sobrescribe DE DÓNDE sacar los values.yaml
    helm:
      valueFiles:
        # Aquí usamos una sintaxis especial y explícita para una fuente secundaria
        - repo: $onramp-private # Usa el repo con el alias 'onramp-private'
          path: environments/dev/5g-core-values.yaml # La ruta del archivo DENTRO de ese repo
          revision: dev # La rama que debe usar de ESE repo

  destination:
    # Apunta al clúster donde está instalado Argo CD
    server: 'https://kubernetes.default.svc'

    # El namespace donde se despliegan los recursos del 5G Core
    namespace: aether-5gc