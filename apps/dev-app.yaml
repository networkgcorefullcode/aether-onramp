apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aether-5g-core-dev
  namespace: argocd
spec:
  # El proyecto por defecto donde viven los recursos de la App
  project: default

  source:
    #  APUNTA A LA URL DEL CHART
    repoURL: https://charts.aetherproject.org
    chart: 'sd-core' # Nombre del chart
   #path: some/path # por ahora no aplica
    targetRevision: 2.2.4 # La versión del chart

    # Sobrescribe DE DÓNDE sacar los values.yaml
    helm:
      valueFiles:
        # Aquí usamos la sintaxis de cadena simple, pero referenciando un alias.
        # El alias 'values-private' lo definiremos abajo en la sección 'sources'.
        - $values-private/environments/dev/5g-core-values.yaml

  # --- La sección 'sources' (plural) describe TODAS las fuentes ---
  sources:
    # FUENTE #1: El repositorio PRIVADO de valores
    - repoURL: $onramp-private # Alias
      # Le decimos a Argo CD que debe usar la rama 'dev' de este repositorio.
      targetRevision: dev
      # Le damos un alias INTERNO a esta fuente para usarlo en 'valueFiles'
      ref: values-private

    # FUENTE #2: (Opcional pero recomendado para claridad) El repositorio del Helm Chart
    - repoURL: https://charts.aetherproject.org
      chart: sd-core
      targetRevision: 2.2.4

  destination:
    # Apunta al clúster donde está instalado Argo CD
    server: 'https://kubernetes.default.svc'

    # El namespace donde se despliegan los recursos del 5G Core
    namespace: aether-5gc

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true