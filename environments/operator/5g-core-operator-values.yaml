# Disable 4G Control Plane
omec-control-plane:
  enable4G: false

# Disable 5G RAN Simulator
5g-ran-sim:
  enable: false

# Override values for 5g-control-plane Helm Chart
# https://github.com/omec-project/sdcore-helm-charts/blob/main/5g-control-plane/values.yaml
5g-control-plane:
  enable5G: true
  images:
    # repository: "ghcr.io/networkgcorefullcode/"
    repository: "ghcr.io/networkgcorefullcode/"
    tags:
      init: omecproject/pod-init:rel-1.1.3
      amf: omecproject/5gc-amf:2.0.5-dev
      ausf: omecproject/5gc-ausf:2.0.5-dev
      smf: omecproject/5gc-smf:3.0.2-dev
      udm: omecproject/5gc-udm:3.0.2-dev
      udr: omecproject/5gc-udr:2.1.7-dev
      pcf: omecproject/5gc-pcf:2.0.3-dev
      nrf: omecproject/5gc-nrf:2.0.8-dev
      webui: omecproject/5gc-webui:2.0.1-dev
      sctplb: omecproject/sctplb:1.6.6-dev
      nssf: omecproject/5gc-nssf:1.7.2-dev
      upfadapter: omecproject/upfadapter:2.0.6-dev
      metricfunc: omecproject/metricfunc:rel-1.6.2
    # refer to above Helm Chart to add other NF images

  kafka:
    deploy: true
    fullnameOverride: kafka
    zookeeper:
      persistence:
        enabled: false
      image:
        registry: docker.io
        repository: bitnamilegacy/zookeeper
        tag: 3.8.0-debian-11-r74
    persistence:
      enabled: false
    image:
      registry: docker.io
      repository: bitnamilegacy/kafka
      tag: 3.3.1-debian-11-r34
      digest: ""
    initContainers:
      - name: wait-for-zookeeper
        image: busybox
        command: ['sh', '-c', 'until nc -z sd-core-zookeeper 2181; do echo waiting for zookeeper; sleep 2; done;']

  mongodb:
    deploy: true
    usePassword: false
    persistence:
      enabled: false
    architecture: replicaset
    replicaCount: 2
    image:
      registry: docker.io
      repository: bitnamilegacy/mongodb
      tag: 6.0.8-debian-11-r20


  config:
    logger:
      NRF:
        debugLevel: debug
      WEBUI:
        debugLevel: debug

    mongodb:
      name: aether
      url: mongodb://mongodb-arbiter-headless # Enable if cluster deployment required
      authKeysDbName: authentication
      authUrl: mongodb://mongodb-arbiter-headless

    managedByConfigPod:
      enabled: true
      syncUrl: http://sdcore-adapter-v2-1.aether-roc.svc:8080/synchronize

    metricfunc:
      deploy: true
      serviceType: ClusterIP
      prometheus:
        port: 9089
      apiEndpoint:
        port: 9301
      cfgFiles:
        metricscfg.yaml:
          configuration:
            controllerFlag: false
            nfStreams:
              - topic:
                  topicGroup: analytics
                  topicName: sdcore-data-source-amf
                urls:
                  - uri: "kafka-headless"
                    port: 9092
              - topic:
                  topicGroup: analytics
                  topicName: sdcore-data-source-smf
                urls:
                  - uri: "kafka-headless"
                    port: 9092
            prometheusServer:
              addr: POD_IP
              port: 9089
            apiServer:
              addr: POD_IP
              port: 9301
            debugProfileServer:
              addr: POD_IP
              port: 5001
            userAppApiServer:
              addr: "userAppapp"
              port: 9301
            rocEndPoint:
              addr: "roc-aether-roc-gui-v2-1-external.aether-roc.svc"
              port: 80
            metricFuncEndPoint:
              addr: "metricfunc.aether-5gc.svc"
              port: 5001
          info:
            description: Metrics initial local configuration
            version: 1.0.0
          logger:
            level: info

    sctplb:
      deploy: true
      podAnnotations:
        field.cattle.io/workloadMetrics: '[{"path":"/metrics","port":9089,"schema":"HTTP"}]'
      serviceType: ClusterIP
      sctp_grpc:
        port: 9000
        #nodePort: 30088
      ngapp:
        externalIp: 192.168.10.50
        port: 38412
        #nodePort: 30071
      cfgFiles:
        sctplb.yaml:
          info:
            version: 1.0.0
            description: SCTPLB initial local configuration
          logger:
            sctpLogs: info
            dispatcherLogs: info
            clientdiscLogs: info
          configuration:
            type: "grpc"
            services:
              - uri: "amf-headless"
            ngapIpList:
              - 0.0.0.0


    # Change AMF config here if rquired
    # Most of the AMF config comes from Slice APIs but some of the config is
    # directly provided through Helm Charts
    amf:
      deploy: true
      serviceType: ClusterIP
      #ngapp:
       # nodePort: 30071
      cfgFiles:
        amfcfg.yaml:
          configuration:
            enableDBStore: true # Store AMF subscribers in the datastore
            kafkaInfo:
              enableKafka: false
              brokerUri: "kafka-headless"
              brokerPort: 9092
              topicName: "sdcore-data-source-amf"
            networkFeatureSupport5GS: # 5gs Network Feature Support IE, refer to TS 24.501 sec. 9.11.3.5
              imsVoPS: 1 # IMS voice over PS session indicator (uinteger, range: 0~1)
            security:
              integrityOrder:
                - NIA3
                - NIA2
            #     - NIA0
              cipheringOrder:
                - NEA3
                - NEA2
            #     - NEA0
            sbi: # Service-based interface information
              scheme: http # the protocol for sbi (http or https)
              registerIPv4: amf # IP used to register to NRF
              bindingIPv4: 0.0.0.0  # IP used to bind the service
              port: 29518 # port used to bind the service
              tls: # the local path of TLS key
                key: /var/run/certs/tls.key # AMF TLS Private key
                pem: /var/run/certs/tls.crt # AMF TLS Certificate
            nrfUri: "http://nrf:29510" # a valid URI of NRF

    ausf:
      deploy: true
      serviceType: ClusterIP
      cfgFiles:
        ausfcfg.yaml:
          configuration:
            enableDBStore: true
            groupId: ausfGroup001
            sbi:
              bindingIPv4: 0.0.0.0
              port: 29509
              registerIPv4: ausf
              scheme: http
              tls: # the local path of TLS key
                key: /var/run/certs/tls.key # AUSF TLS Private key
                pem: /var/run/certs/tls.crt # AUSF TLS Certificate
            serviceNameList:
              - nausf-auth
            nrfUri: "http://nrf:29510"
            webuiUri: "http://webui:5001" # URI del WebUI del AMF
          logger:
            AUSF:
              debugLevel: debug
              ReportCaller: false


    udr:
      deploy: true
      serviceType: ClusterIP
      sbi:
        port: 29504
      # Provide nodePort when serviceType is NodePort
      #nodePort: 30074
      cfgFiles:
        udrcfg.yaml:
          configuration:
            enableDBStore: true
            sbi: # Service Based Interface
              scheme: http
              registerIPv4: udr
              bindingIPv4: 0.0.0.0
              port: 29504
              tls: # the local path of TLS key
                key: /var/run/certs/tls.key # UDR TLS Private key
                pem: /var/run/certs/tls.crt # UDR TLS Certificate
            mongodb:
              name: "aether"                      # Nombre de la base de datos
              url: mongodb://mongodb-arbiter-headless  # URL de conexión con credenciales y host:puerto
            nrfUri: "http://nrf:29510"
            webuiUri: "http://webui:5001"
          logger:
            UDR:
              debugLevel: debug
              ReportCaller: false


    udm:
      deploy: true
      serviceType: ClusterIP
      ssm:
        enable: false
      sbi:
        port: 29503
        # Provide nodePort when serviceType is NodePort
        #nodePort: 30074
      cfgFiles:
        udmcfg.yaml:
          configuration:
            enableDBStore: true
            sbi:
              bindingIPv4: 0.0.0.0
              port: 29503
              registerIPv4: udm
              scheme: http
              tls:
                key: /var/run/certs/tls.key # UDM TLS Private key
                pem: /var/run/certs/tls.crt # UDM TLS Certificate
            keys:
              udmProfileAHNPublicKey: 5a8d38864820197c3394b92613b20b91633cbd897119273bf8e4a6f4eec0a650
              udmProfileAHNPrivateKey: c53c22208b61860b06c62e5406a7b330c2b577aa5558981510d128247d38bd1d
              udmProfileBHNPublicKey: 0472DA71976234CE833A6907425867B82E074D44EF907DFB4B3E21C1C2256EBCD15A7DED52FCBB097A4ED250E036C7B9C8C7004C4EEDC4F068CD7BF8D3F900E3B4
              udmProfileBHNPrivateKey: F1AB1074477EBCC7F554EA1C5FC368B1616730155E0041AC447D6301975FECDA
            nrfUri: "http://nrf:29510"
            plmnList:
              - plmnId:
                  mcc: "208"
                  mnc: "93"
              - plmnId:
                  mcc: "222"
                  mnc: "88"
            enableNrfCaching: true
            nrfCacheEvictionInterval: 900
            webuiUri: "http://webui:5001"
            serviceList:
              - nudm-sdm
              - nudm-uecm
              - nudm-ueau
              - nudm-ee
              - nudm-pp
            ssm:
              enable: false
              host: https://localhost:9000 ## revisar mas tarde Esta es la ip del ssm
              tls_insecure: true
              m-tls:
                crt: /etc/udm/tls/tls.crt
                key: /etc/udm/tls/tls.key
                ca: /etc/udm/tls/ca.crt
            #metricsPort: ":8080" # revisar mas tarde, Pedro puso este metrics port  pero no existia en la version del values del helm chart 3.0.0 asi que verificar si sirve pa algo eventualmente
          info:
            description: UDM initial local configuration
            version: 1.0.0
          logger:
            UDM:
              debugLevel: debug
              ReportCaller: false


    # SMF config override. Refer to Helm Charts values for more options
    smf:
      deploy: true
      cfgFiles:
        smfcfg.yaml:
          configuration:
            kafkaInfo:
              enableKafka: false
              brokerUri: "kafka-headless"
              brokerPort: 9092
              topicName: "sdcore-data-source-smf"
            enableDBStore: true  # Store SMF subscribers in the datastore
            sbi: # Service-based interface information
              scheme: http # the protocol for sbi (http or https)
              registerIPv4: smf # IP used to register to NRF
              bindingIPv4: 0.0.0.0  # IP used to bind the service
              port: 29502 # Port used to bind the service
              tls: # the local path of TLS key
                key: /var/run/certs/tls.key # SMF TLS Private key
                pem: /var/run/certs/tls.crt # SMF TLS Certificate
            nrfUri: http://nrf:29510 # a valid URI of NRF

    nssf:
      deploy: true
      cfgFiles:
        nssfcfg.yaml:
          configuration:
            nrfUri: http://nrf:29510
            webuiUri: http://webui:5001
            nsiList:
              - nsiInformationList:
                  - nrfId: http://nrf:29510/nnrf-nfm/v1/nf-instances
                    nsiId: 22
                snssai:
                  sd: "010203"
                  sst: 1
              - nsiInformationList:
                  - nrfId: http://nrf:29510/nnrf-nfm/v1/nf-instances
                    nsiId: 23
                snssai:
                  sd: "000001"
                  sst: 1
              - nsiInformationList:
                  - nrfId: http://nrf:29510/nnrf-nfm/v1/nf-instances
                    nsiId: 24
                snssai:
                  sd: "000002"
                  sst: 2
              - nsiInformationList:
                  - nrfId: http://nrf:29510/nnrf-nfm/v1/nf-instances
                    nsiId: 25
                snssai:
                  sd: "000003"
                  sst: 3
            nssfName: NSSF
            sbi:
              bindingIPv4: 0.0.0.0
              port: 29531
              registerIPv4: nssf
              scheme: http
              tls:
                key: /var/run/certs/tls.key
                pem: /var/run/certs/tls.crt
            serviceNameList:
              - nnssf-nsselection
              - nnssf-nssaiavailability

    pcf:
      deploy: true
      serviceType: ClusterIP
      sbi:
        port: 29507
        # Provide nodePort when serviceType is NodePort
        #nodePort: 30077
      cfgFiles:
        pcfcfg.yaml:
          configuration:
            pcfName: PCF
            defaultBdtRefId: BdtPolicyId-
            enableNrfCaching: true
            nrfCacheEvictionInterval: 900
            nrfUri: http://nrf:29510
            webuiUri: http://webui:5001
            sbi:
              bindingIPv4: 0.0.0.0
              registerIPv4: pcf
              scheme: http
              tls: # the local path of TLS key
                key: /var/run/certs/tls.key # PCF TLS Private key
                pem: /var/run/certs/tls.crt # PCF TLS Certificate
            serviceList:
              - serviceName: npcf-am-policy-control
              - serviceName: npcf-smpolicycontrol
                suppFeat: 3fff
              - serviceName: npcf-bdtpolicycontrol
              - serviceName: npcf-policyauthorization
                suppFeat: 3
              - serviceName: npcf-eventexposure
              - serviceName: npcf-ue-policy-control

    nrf:
      deploy: true
      cfgFiles:
        nrfcfg.yaml:
          configuration:
            mongoDBStreamEnable: false    # enable/disable MongoDB stream in NRF
            nfProfileExpiryEnable: true   # If enabled, remove NF profile if no keepalive received
            nfKeepAliveTime: 60           # default timeout for NF profiles
            MongoDBName: aether # database name in MongoDB
            MongoDBUrl: "mongodb://mongodb-arbiter-headless" # a valid URL of the mongodb
            sbi: # Service-based interface information
              scheme: http # the protocol for sbi (http or https)
              registerIPv4: nrf # IP used to serve NFs or register to another NRF
              bindingIPv4: 0.0.0.0  # IP used to bind the service
              port: 29510 # port used to bind the service
              tls: # the local path of TLS key
                pem: /var/run/certs/tls.crt # NRF TLS Certificate
                key: /var/run/certs/tls.key # NRF TLS Private key
            serviceNameList: # the SBI services provided by this NRF, refer to TS 29.510
              - nnrf-nfm # Nnrf_NFManagement service
              - nnrf-disc # Nnrf_NFDiscovery service
            webuiUri: "http://webui:5001"

    webui:
      deploy: true
      #podAnnotations:
      serviceType: NodePort
      # serviceAnnotations:
      #   external-dns.alpha.kubernetes.io/hostname: "aether-config.tenant-site.company.com"
      urlport:
        port: 5000
        # Provide nodePort when serviceType is NodePort
        nodePort: 31000
      rest:
        port: 5001
        # Provide nodePort when serviceType is NodePort
        nodePort: 31001
      ssm:
        enable: false
      grpc:
        port: 9876
      ingress:
        enabled: false
        hostname: aether.local
        path: /
        pathType: Prefix
        # extraHosts:
          # - host: aether.local
          #   path: /
      cfgFiles:
        webuicfg.yaml:
          info:
            version: 1.0.0
            description: WebUI initial local configuration
          configuration:
            enableAuthentication: false
            spec-compliant-sdf: false
            mongodb:                    # Configuración de la base de datos MongoDB
              name: "aether"              # (string) Nombre de la base de datos principal
              url: "mongodb://mongodb-arbiter-headless" # (string) URL de conexión a MongoDB
              authKeysDbName: "authentication"   # (string) Nombre de la base de datos de llaves de autenticación
              authUrl: "mongodb://mongodb-arbiter-headless" # (string) URL de autenticación
              webuiDbName: aether ## revisar mas tarde. Estos dos ultimos los puse porque salian en el values de pedro
              webuiDbUrl: "mongodb://mongodb-arbiter-headless"
              checkReplica: true
            ssm:
              ssm-uri: https://localhost:9000 # revisar mas tarde aqui poner la ip de la pc donde se instale el ssm
              allow-ssm: false
              tls-insecure: true
              ssm-synchronize:
                enable: true
                interval-minute: 30
                max-keys-create: 5
                delete-missing: true
                max-sync-keys: 5
                max-sync-users: 5
                max-sync-rotations: 5
              m-tls:
                crt: /etc/webui/tls/tls.crt
                key: /etc/webui/tls/tls.key
                ca: /etc/webui/tls/ca.crt
              # read in cascade if gcm is false then cbc is used if gcm is true cbc is ignored, both is false no encryption is used (disabled SSM jjjj)
              is-encrypt-aes-gcm: true
              is-encrypt-aes-cbc: false
    upfadapter:
      deploy: false
      serviceType: ClusterIP
      n4:
        port: 8805
        # Provide nodePort when serviceType is NodePort
        # nodePort: 30021
      rest:
        port: 8090
        #nodePort: 30080
      cfgFiles:
        upfadaptercfg.yaml:
          info:
            version: 1.0.0
            description: UPF Adapter initial local configuration
          logger:
            level: info
          configuration:
            kafkaInfo:
              brokerUri: "kafka-headless"
              brokerPort: 9092
              topicName: "sdcore-data-source-smf"

# Override values for omec-sub-provision (subscriber) Helm Chart
# https://github.com/omec-project/sdcore-helm-charts/blob/main/omec-sub-provision/values.yaml
# ***Note: Most of these values can (and should) be set via ROC API***
