k8s:
  rke2:
    version: v1.24.17+rke2r1
    config:
      token: purdue-k8s-rke2
      port: 9345
      params_file:
        master: "deps/k8s/roles/rke2/templates/master-config.yaml"
        worker: "deps/k8s/roles/rke2/templates/worker-config.yaml"

  helm:
    version: v3.17.0

core:
  standalone: false			# set to false to place under control of ROC
  data_iface: eth0
  values_file: "deps/5gc/roles/core/templates/sdcore-5g-values.yaml"
  ran_subnet: "192.168.10.0/24"		# set to empty string to get subnet from 'data_iface'
  helm:
    local_charts: false			# set chart_ref to local path name if true
    repo_url: https://networkgcorefullcode.github.io/helm-charts
    chart_ref: aether/sd-core
    chart_version: 3.1.15
  upf:
    access_subnet: "192.168.252.1/24"	# access subnet & gateway
    core_subnet: "192.168.250.1/24"	# core subnet & gateway
    mode: af_packet			# Options: af_packet or dpdk
    multihop_gnb: false # when set to true, external gNB may be on the same subnet as data_iface or multiple hops away
    helm:
      local_charts: false
      chart_ref: aether/bess-upf
      chart_version: 1.3.1
    values_file: "deps/5gc/roles/upf/templates/upf-5g-values.yaml"
    default_upf:
      ip:
        access: "192.168.252.3" # when multihop_gnb set to true, make sure to assign IP from same subnet of data_iface
        core:   "192.168.250.3"
      ue_ip_pool: "192.168.100.0/24"
    additional_upfs:
      "1":
        ip:
          access: "192.168.252.6"
          core:   "192.168.250.6"
        ue_ip_pool: "192.168.101.0/24"
        cpiface_hostname: "upf.aether-5gc-upf-1.svc.cluster.local"
      "2":
        ip:
          access: "192.168.252.7"
          core:   "192.168.250.7"
        ue_ip_pool: "192.168.102.0/24"
        cpiface_hostname: "upf.aether-5gc-upf-2.svc.cluster.local"
      "3":
        ip:
          access: "192.168.252.9"
          core:   "192.168.250.9"
        ue_ip_pool: "192.168.103.0/24"
        cpiface_hostname: "upf.aether-5gc-upf-3.svc.cluster.local"

  amf:
    ip: "192.168.10.50"

gnbsim:
  docker:
    container:
      image: omecproject/5gc-gnbsim:rel-1.6.1
      prefix: gnbsim
      count: 2
    network:
      macvlan:
        name: gnbnet

  router:
    data_iface: ens160
    macvlan:
      subnet_prefix: "192.168"

  servers:
    0:
      - "deps/gnbsim/config/gnbsim-upf-1.yaml"
      - "deps/gnbsim/config/gnbsim-upf-2.yaml"

amp:
  roc_models: "deps/amp/roles/roc-load/templates/roc-5g-models.json"
  # for UPF - comment above line and uncomment following line
  # roc_models: "deps/amp/roles/roc-load/templates/roc-5g-models-upf2.json"
  monitor_dashboard: "deps/amp/roles/monitor-load/templates/5g-monitoring"

  aether_roc:
    helm:
      local_charts: false
      chart_ref: aether/aether-roc-umbrella
      chart_version: 2.1.36

  atomix:
    helm:
      chart_ref: atomix/atomix
      chart_version: 1.1.2

  onosproject:
    helm:
      chart_ref: onosproject/onos-operator
      chart_version: 0.5.6

  store:
    lpp:
      version: v0.0.24

  monitor:
    helm:
      chart_ref: rancher/rancher-monitoring
      chart_version: 101.0.0+up19.0.3

  monitor-crd:
    helm:
      chart_ref: rancher/rancher-monitoring-crd
      chart_version: 101.0.0+up19.0.3

vault:
  version: "1.21.1"
  user: "vault"
  group: "vault"
  install_prerequisites:
    - unzip
    - curl
  config_path: "/etc/vault.hcl"
  data_path: "/opt/vault/data"
  
  # Dev mode configuration
  dev_mode: true
  address: "0.0.0.0:8200"
  
  # Unseal configuration
  unseal_keys_dir_output: "{{ playbook_dir }}/vault_keys/unseal_keys"
  root_token_dir_output: "{{ playbook_dir }}/vault_keys/root_token"
